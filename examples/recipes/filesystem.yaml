# ToolFence policy for Filesystem MCP server
version: 1
default: ask

rules:
  - id: protect-secrets
    effect: deny
    operations: [fs.read, fs.write, fs.delete]
    resources:
      - "**/.env"
      - "**/.env.*"
      - "**/*.pem"
      - "${home}/.ssh/**"

  - id: allow-workspace-read
    effect: allow
    operations: [fs.read]
    resources:
      - "${workspace}/**"

  - id: allow-workspace-write
    effect: allow
    operations: [fs.write]
    resources:
      - "${workspace}/**"

  - id: allow-git-read
    effect: allow
    operations: [git.read]
