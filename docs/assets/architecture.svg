<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">ToolFence architecture</title>
  <desc id="desc">MCP hosts send tool calls through ToolFence, which normalizes calls, evaluates policy, requests approval when needed, and writes privacy-conscious audit records before forwarding allowed calls to a stdio MCP server.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#58a6ff"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="24" fill="#0d1117"/>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="55" y="112" width="250" height="205" rx="18" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
    <text x="180" y="155" text-anchor="middle" fill="#f0f6fc" font-size="25" font-weight="700">MCP hosts</text>
    <text x="180" y="201" text-anchor="middle" fill="#c9d1d9" font-size="20">Codex</text>
    <text x="180" y="237" text-anchor="middle" fill="#c9d1d9" font-size="20">Cursor</text>
    <text x="180" y="273" text-anchor="middle" fill="#c9d1d9" font-size="20">Claude Desktop</text>

    <rect x="430" y="65" width="340" height="300" rx="20" fill="#13233a" stroke="#58a6ff" stroke-width="2" filter="url(#shadow)"/>
    <text x="600" y="112" text-anchor="middle" fill="#f0f6fc" font-size="30" font-weight="800">ToolFence</text>
    <rect x="472" y="143" width="256" height="42" rx="10" fill="#1f6feb"/>
    <text x="600" y="171" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">normalize tool call</text>
    <rect x="472" y="199" width="256" height="42" rx="10" fill="#238636"/>
    <text x="600" y="227" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">allow · deny · ask</text>
    <rect x="472" y="255" width="256" height="42" rx="10" fill="#9e6a03"/>
    <text x="600" y="283" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">human approval</text>
    <text x="600" y="332" text-anchor="middle" fill="#8b949e" font-size="17">privacy-conscious JSONL audit</text>

    <rect x="895" y="112" width="250" height="205" rx="18" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
    <text x="1020" y="155" text-anchor="middle" fill="#f0f6fc" font-size="25" font-weight="700">stdio MCP server</text>
    <text x="1020" y="207" text-anchor="middle" fill="#c9d1d9" font-size="19">Filesystem</text>
    <text x="1020" y="242" text-anchor="middle" fill="#c9d1d9" font-size="19">Shell · Git · HTTP</text>
    <text x="1020" y="282" text-anchor="middle" fill="#ff7b72" font-size="16">not process-sandboxed</text>

    <line x1="305" y1="214" x2="415" y2="214" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="770" y1="214" x2="880" y2="214" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="360" y="192" text-anchor="middle" fill="#8b949e" font-size="15">tools/call</text>
    <text x="825" y="192" text-anchor="middle" fill="#8b949e" font-size="15">allowed only</text>
  </g>
</svg>
